network:
  name: kubelab
  domain: dev.site
  forward:
    mode: nat
  bridge:
    name: kubelab
    stp: "on"
    delay: 0
  mac: "52:54:00:00:00:00"
  ip:
    address: 192.168.115.1
    netmask: 255.255.255.0
  dhcp:
    range:
      start: 192.168.115.128
      end: 192.168.115.254
ansible:
  # Inventory is from ansible/inventory
  inventory:
    all_vars:
      ansible_ssh_user: root
      touchD: /var/local/ansible/touch
      filesD: /var/local/ansible/files
      pod_network_cidr: 10.244.0.0/16
      kube_apiserver_port: 6443
      kube_apiserver_vip_hostname: kubeapi.dev.site
      kube_apiserver_vip: 192.168.115.10
      kube_apiserver_vip_port: 6443
    lb_vars:
      keepalived_virtual_router_id: 1
    gen_lb_vars:
      - keepalived_auth_pass

hosts:
  - name: control1
    fqdn: control1.dev.site
    ip: 192.168.115.11
    mac: 52:54:00:19:20:d1
    mem_size: 4096
    mem_cur_size: 4
    vcpu_count: "2"
    os_id: ubuntu-lts-latest
    vol_pool: default
    vol_name: control1.qcow2
    src_image: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    ansible:
      group: control

  - name: control2
    ansible_group: control
    fqdn: control2.dev.site
