---
- name: Wait For - kubeadm install on seed host
  wait_for:
    path: /usr/bin/kubeadm
  delegate_to: "{{ seedmaster }}"

- name: Wait For - kubeadm install
  wait_for:
    path: /usr/bin/kubeadm
    state: started
    timeout: 300

- name: Wait For - containerd start
  wait_for:
    path: /run/containerd/containerd.sock
    state: present
    timeout: 300

# tasks file for kube-control-plane
- name: Initialization - kubeaadm init seedmaster
  shell:
    cmd: kubeadm init --apiserver-bind-port {{ kube_apiserver_port }} --control-plane-endpoint "{{ kube_apiserver_vip_hostname }}:{{ kube_apiserver_vip_port }}" --upload-certs --pod-network-cidr={{ pod_network_cidr }} > /root/kubeadmin_init.log
    creates: "/etc/kubernetes/admin.conf"
  when: inventory_hostname == seedmaster

- name: Wait - kubeadmin init seedmaster
  wait_for:
    path: "/etc/kubernetes/admin.conf"
  delegate_to: "{{ seedmaster }}"

- name: Install - kube-gen-add-control.sh
  copy:
    src: "{{role_path}}/files/usr/local/sbin/kube-gen-add-control.sh"
    dest: "/usr/local/sbin/kube-gen-add-control.sh"
    mode: "700"
  when: inventory_hostname == seedmaster

- name: Generate - kube-add-control.sh
  shell:
    cmd: bash -c "umask 077; bash /usr/local/sbin/kube-gen-add-control.sh /var/local/ansible/files/kube-add-control.sh"
    creates: "/var/local/ansible/files/kube-add-control.sh"
  when: inventory_hostname == seedmaster

- name: Wait - kube-add-control.sh
  wait_for:
    path: /var/local/ansible/files/kube-add-control.sh
  delegate_to: "{{ seedmaster }}"
  when: inventory_hostname != seedmaster

- name: Fetch - kube-add-control.sh
  fetch:
    src: "/var/local/ansible/files/kube-add-control.sh"
    dest: /tmp/
    flat: true
  delegate_to: "{{ seedmaster }}"
  when: inventory_hostname != seedmaster

- name: Copy - kube-add-control.sh
  copy:
    src: /tmp/kube-add-control.sh
    dest: /usr/local/sbin/kube-add-control.sh
    mode: "700"
  when: inventory_hostname != seedmaster

- name: Wait - kubeadmin init seedmaster port
  wait_for:
    host: 0.0.0.0
    port: 6443
    timeout: 1800
  delegate_to: "{{ seedmaster }}"
  when: inventory_hostname != seedmaster

- name: Wait for kube-net
  wait_for:
    path: "{{ touchD }}/install_calico"
  delegate_to: "{{ seedmaster }}"
  when: inventory_hostname != seedmaster

- name: Check if kubernetes has been initialized
  stat:
    path: /etc/kubernetes/admin.conf
  register: kube_config_file

- name: Disable backend vip temporarily
  shell:
    cmd: backendvip.py disable --all-vips
  when:
    - not kube_config_file.stat.exists
    - inventory_hostname != seedmaster

- name: Kubernetes add control
  shell:
    cmd: /usr/local/sbin/kube-add-control.sh
    creates: /etc/kubernetes/admin.conf
  when: inventory_hostname != seedmaster
  notify: Enable backend vip

- name: Config - kubectl (1/2)
  file:
    path: /root/.kube
    state: directory
    mode: "750"

- name: Config - kubectl (2/2)
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    mode: "600"
    remote_src: yes

# Match the version of etcd using
# kubectl get pods -n kube-system -l component=etcd -o jsonpath='{.items[*].spec.containers[*].image}'

- name: Download etcdctl etcdutl
  get_url:
    url: https://storage.googleapis.com/etcd/v3.6.8/etcd-v3.6.8-linux-amd64.tar.gz
    dest: "{{filesD}}/etcd-v3.6.8-linux-amd64.tar.gz"

- name: Extract etcdctl etcdutl
  unarchive:
    src: "{{filesD}}/etcd-v3.6.8-linux-amd64.tar.gz"
    dest: "{{filesD}}/"
    creates: "{{filesD}}/etcd-v3.6.8-linux-amd64/etcdctl"
    remote_src: yes

- name: Install etcdctl etcdutl
  copy:
    src: "{{filesD}}/etcd-v3.6.8-linux-amd64/{{item}}"
    dest: "/usr/local/sbin/{{item}}"
    owner: "root"
    group: "root"
    mode: "0750"
    remote_src: yes
  loop:
    - etcdctl
    - etcdutl

- name: Install etcdbackup
  copy:
    src: "{{role_path}}/files/usr/local/sbin/etcdbackup.py"
    dest: "/usr/local/sbin/etcdbackup"
    owner: "root"
    group: "root"
    mode: "0750"

- name: Cron etcdbackup
  cron:
    name: etcdbackup
    minute: "0"
    hour: "0"
    job: /usr/local/sbin/etcdbackup backup
