---
# tasks file for kube-common

#
# Kernel modules
#
- name: Check for kubernetes kernel modules
  stat:
    path: /proc/sys/net/bridge/bridge-nf-call-iptables
  register: kubernetes_modules

# Load kernel modules before sysctl runs — sysctl needs the /proc/sys
# entries these modules create, which don't exist until the module loads.
- block:
    - name: Kernel modules - overlay br_netfilter
      copy:
        content: |
          overlay
          br_netfilter
        dest: /etc/modules-load.d/kubernetes.conf

    - name: Systemd reload - systemd-modules-load
      shell:
        cmd: systemctl restart systemd-modules-load

  when: not kubernetes_modules.stat.exists

#
# sysctl.conf(s)
#
- name: Sysctl Kubernetes
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    state: present
    reload: yes
  loop:
    - { key: net.bridge.bridge-nf-call-iptables, value: 1 }
    - { key: net.bridge.bridge-nf-call-ip6tables, value: 1 }
    - { key: net.ipv4.ip_forward, value: 1 }
  notify: Restart - systemd-sysctl

#
# Kubernetes apt repository
#

# Kubernetes gpg key
- name: Add Kubernetes apt key
  shell:
    cmd: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Permissions Kubernetes apt key
  file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Add Kubernetes apt repository
  copy:
    src: "{{role_path}}/files/kubernetes.list"
    dest: /etc/apt/sources.list.d/kubernetes.list
  register: apt_repository_file

- name: Update apt cache
  apt:
    update_cache: true
  when: apt_repository_file.changed

- name: Install containerd
  apt:
    name:
      - "runc"
      - "containerd"
    state: present
  notify:
    - Restart - containerd

- name: Install kubeadm, kubectl, kubelet, cri-tools
  apt:
    name:
      - "kubectl"
      - "kubeadm"
      - "kubelet"
      - "cri-tools"

- name: Service - containerd
  service:
    name: containerd
    state: started
