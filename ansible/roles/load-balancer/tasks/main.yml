---
# tasks file for kube-lb

- name: Deb Install - keepalived
  apt:
    name:
      - keepalived
    state: latest
    lock_timeout: "{{ apt_package_timeout }}"

- name: keepalived ipvs config - keepalived.conf
  template:
    src: "{{role_path}}/templates/etc/keepalived/keepalived.conf.j2"
    dest: /etc/keepalived/keepalived.conf
  notify: Restart - keepalived

- name: Service - keepalived
  service:
    name: keepalived
    state: started
